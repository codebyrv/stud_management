<!doctype html>
<html lang="en">
<head>
    <title>Student Management</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body style="background: linear-gradient(to right, #74ebd5, #ACB6E5);">

<div class="container mt-5">

    <h2 class="text-center text-white mb-4">🎓 Student Management EDIT</h2>

    <!-- FORM -->
    <div class="card shadow-lg p-4 rounded-4">
        <form method="POST">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" value="{{data.stud_name}}" name="name" placeholder="Student Name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" class="form-control" value="{{data.age}}" name="age" placeholder="Age" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="email" class="form-control" value="{{data.email}}" name="email" placeholder="Email" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" value="{{data.phone}}" name="phone" placeholder="Phone" required>
                </div>
            </div>

            <div class="text-center">
                
                <button type="submit" class="btn btn-warning px-4">SAVE</button>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
